[project]
name = "cu-api"
version = "0.1.0"
description = "CU Platform backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "celery[redis]>=5.4.0",
  "redis>=5.2.0",
  "python-multipart>=0.0.17",
  "httpx>=0.28.0",
  "passlib[bcrypt]>=1.9.5",
  "bcrypt>=5.0.0",
  "pyjwt>=2.15.1",
  "email-validator>=2.4.0",
  "aiosqlite>=0.22.1",
  "pyotp>=2.12.1",
  "slowapi>=0.1.10",
  "imageio-ffmpeg>=0.8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]
