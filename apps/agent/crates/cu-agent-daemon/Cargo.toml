[package]
name = "cu-agent-daemon"
version = "0.1.0"
edition = "2021"
description = "Headless CU endpoint monitoring daemon (no UI)"

[[bin]]
name = "cu-agent-daemon"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
cu-agent-core = { path = "../cu-agent-core" }
serde_json = "1"
sysinfo = "0.33"

[target.'cfg(target_os = "macos")'.dependencies]
cu-platform-macos = { path = "../cu-platform-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
cu-platform-windows = { path = "../cu-platform-windows" }
