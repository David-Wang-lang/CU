[package]
name = "cu-agent-daemon"
version = "0.1.0"
edition = "2021"
description = "Headless CU Loader background agent (no UI)"

[[bin]]
name = "CU-Loader"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
cu-agent-core = { path = "../cu-agent-core" }
serde_json = "1"
sysinfo = "0.33"

[target.'cfg(target_os = "macos")'.dependencies]
cu-platform-macos = { path = "../cu-platform-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
cu-platform-windows = { path = "../cu-platform-windows" }
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Environment",
  "Win32_System_RemoteDesktop",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }
