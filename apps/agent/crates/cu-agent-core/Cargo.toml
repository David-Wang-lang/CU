[package]
name = "cu-agent-core"
version = "0.1.0"
edition = "2021"
description = "Shared CU agent business logic"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
hostname = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "rayon"] }
