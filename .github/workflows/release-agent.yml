name: Release agent (macOS + Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-daemon:
    name: Daemon (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cu-agent-daemon-windows-x64.exe
            bin: cu-agent-daemon.exe
          # macos-latest is Apple Silicon; cross-compile Intel from the same runner
          # (avoids scarce macos-13 queues and unsupported macos-14-arm64 labels).
          - name: macos-arm
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: cu-agent-daemon-macos-arm64
            bin: cu-agent-daemon
          - name: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: cu-agent-daemon-macos-x64
            bin: cu-agent-daemon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build daemon (release)
        working-directory: apps/agent
        run: cargo build -p cu-agent-daemon --release --target ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        run: |
          SRC="apps/agent/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          mkdir -p dist
          cp "$SRC" "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.name }}
          path: dist/${{ matrix.artifact }}

  build-setup:
    name: Setup app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-arm
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build agent frontend
        working-directory: apps/agent
        run: pnpm build
      - name: Build Tauri setup (unsigned)
        working-directory: apps/agent
        shell: bash
        env:
          CI: true
        # Frontend already built; skip beforeBuildCommand via a merge config file
        # (inline --config JSON breaks under Windows PowerShell escaping).
        # Prefer nsis/dmg only so Windows does not require WiX for MSI.
        run: |
          printf '%s\n' '{"build":{"beforeBuildCommand":""}}' > tauri-ci-config.json
          pnpm tauri build \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" \
            --config tauri-ci-config.json
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.name }}
          path: |
            apps/agent/src-tauri/target/${{ matrix.target }}/release/bundle
            apps/agent/target/${{ matrix.target }}/release/bundle
          if-no-files-found: warn

  pack-artifacts:
    name: Pack downloadable artifacts
    needs: [build-daemon, build-setup]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name 'cu-agent-daemon*' -o \
            -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o \
            -name '*.app.tar.gz' -o -name '*.nsis.zip' \
          \) -exec cp {} release/ \;
          ls -laR artifacts release || true
      - uses: actions/upload-artifact@v4
        with:
          name: cu-agent-release-files
          path: release/*
          if-no-files-found: warn

  release:
    name: GitHub Release
    needs: [pack-artifacts]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cu-agent-release-files
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
